name: Build & Deploy to SmarterASP.NET

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ vars.FTP_DIR || '/site1/' }}
      FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftp' }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. Prepare Production Configuration
        shell: bash
        run: |
          python3 -c "
          import json, os
          path = 'src/MaleFashion.Web/appsettings.Production.json'
          conn = os.environ.get('PROD_DB_CONN', '')
          is_sandbox = os.environ.get('SSLCOMMERZ_IS_SANDBOX', 'true').lower() == 'true'

          data = {
              'ConnectionStrings': {
                  'DefaultConnection': conn if conn else 'Server=YOUR_SERVER;Database=MaleFashion;Trust Server Certificate=True'
              },
              'APPLY_MIGRATIONS': True,
              'SmtpSettings': {
                  'Host': os.environ.get('SMTP_HOST', 'smtp.gmail.com'),
                  'Port': int(os.environ.get('SMTP_PORT', '587')),
                  'Username': os.environ.get('SMTP_USERNAME', 'your_email@example.com'),
                  'Password': os.environ.get('SMTP_PASSWORD', 'YOUR_GMAIL_APP_PASSWORD_HERE'),
                  'FromName': os.environ.get('SMTP_FROM_NAME', 'Male Fashion Support'),
                  'FromEmail': os.environ.get('SMTP_FROM_EMAIL', 'support@example.com'),
                  'Timeout': 10000,
                  'SmtpEncryption': os.environ.get('SMTP_ENCRYPTION', 'StartTls')
              },
              'SSLCommerz': {
                  'StoreId': os.environ.get('SSLCOMMERZ_STORE_ID', 'YOUR_SSLCOMMERZ_STORE_ID'),
                  'StorePassword': os.environ.get('SSLCOMMERZ_STORE_PASSWORD', 'YOUR_SSLCOMMERZ_STORE_PASSWORD'),
                  'IsSandbox': is_sandbox,
                  'BaseUrl': 'https://sandbox.sslcommerz.com' if is_sandbox else 'https://securepay.sslcommerz.com'
              },
              'ReCaptcha': {
                  'SiteKey': os.environ.get('RECAPTCHA_SITE_KEY', 'YOUR_RECAPTCHA_V3_SITE_KEY'),
                  'SecretKey': os.environ.get('RECAPTCHA_SECRET_KEY', 'YOUR_RECAPTCHA_V3_SECRET_KEY'),
                  'MinimumScore': 0.5,
                  'IsEnabled': os.environ.get('RECAPTCHA_IS_ENABLED', 'false').lower() == 'true'
              },
              'Logging': {
                  'LogLevel': {
                      'Default': 'Information',
                      'Microsoft.AspNetCore': 'Warning'
                  }
              },
              'AllowedHosts': '*'
          }

          with open(path, 'w') as f:
              json.dump(data, f, indent=2)

          print('Prepared appsettings.Production.json with all services successfully.')
          "
        env:
          PROD_DB_CONN: ${{ secrets.PROD_DB_CONNECTION }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME || 'Male Fashion Support' }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL || vars.SMTP_FROM_EMAIL }}
          SSLCOMMERZ_STORE_ID: ${{ secrets.SSLCOMMERZ_STORE_ID }}
          SSLCOMMERZ_STORE_PASSWORD: ${{ secrets.SSLCOMMERZ_STORE_PASSWORD }}
          SSLCOMMERZ_IS_SANDBOX: ${{ vars.SSLCOMMERZ_IS_SANDBOX || 'true' }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          RECAPTCHA_IS_ENABLED: ${{ vars.RECAPTCHA_IS_ENABLED || 'false' }}

      - name: 4. Restore Dependencies
        run: dotnet restore src/MaleFashion.Web/MaleFashion.Web.csproj

      - name: 5. Publish Application (Self-Contained for SmarterASP)
        run: >
          dotnet publish src/MaleFashion.Web/MaleFashion.Web.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o ./publish

      - name: 6. Take Site Offline (Upload app_offline.htm)
        shell: bash
        run: |
          cat << 'EOF' > app_offline.htm
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8" />
              <title>Updating MaleFashion</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding-top: 15%; background: #f8f9fa; color: #333; }
                  h1 { font-size: 2rem; margin-bottom: 10px; }
                  p { color: #666; font-size: 1.1rem; }
              </style>
          </head>
          <body>
              <h1>Deploying Updates...</h1>
              <p>The site is currently updating. Please refresh in 30 seconds.</p>
          </body>
          </html>
          EOF

          echo "Uploading app_offline.htm to SmarterASP.NET..."
          curl --ftp-pasv --ftp-create-dirs -T app_offline.htm -u "${FTP_USERNAME}:${FTP_PASSWORD}" "${FTP_PROTOCOL}://${FTP_SERVER}${FTP_DIR}app_offline.htm" || echo "Note: app_offline upload skipped, proceeding with deploy."
          sleep 3

      - name: 7. Deploy Published Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_DIR || '/site1/' }}
          local-dir: ./publish/
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          port: 21
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.local.json
            **/Logs/**
            **/app_offline.htm

      - name: 8. Bring Site Back Online (Remove app_offline.htm)
        if: always()
        shell: bash
        run: |
          echo "Removing app_offline.htm to restart the application..."
          curl --ftp-pasv -u "${FTP_USERNAME}:${FTP_PASSWORD}" -Q "DELE ${FTP_DIR}app_offline.htm" "${FTP_PROTOCOL}://${FTP_SERVER}/" || echo "app_offline.htm already removed or not present."
