services:
  web:
    build:
      context: .
      dockerfile: src/MaleFashion.Web/Dockerfile
    container_name: malefashion-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_HTTP_PORTS=8080
      - APPLY_MIGRATIONS=${APPLY_MIGRATIONS:-true}
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${DB_NAME:-MaleFashion};User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd!};TrustServerCertificate=True
      - Serilog__WriteTo__1__Args__connectionString=Server=sqlserver,1433;Database=${DB_NAME:-MaleFashion};User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd!};TrustServerCertificate=True
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - uploads_data:/app/wwwroot/uploads
      - logs_data:/app/Logs
      - ./src/MaleFashion.Web/appsettings.local.json:/app/appsettings.local.json:ro

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: malefashion-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd!}
      - MSSQL_PID=${MSSQL_PID:-Developer}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mssql_data:
  uploads_data:
  logs_data:

